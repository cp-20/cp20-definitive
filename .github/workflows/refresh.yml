name: Refresh content and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cp20-production
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Gather independent public sources
        id: sync
        run: npm run sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRAP_GHOST_ADMIN_KEY: ${{ secrets.TRAP_GHOST_ADMIN_KEY }}
      - name: Check and build
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        run: npm run check && npm run build
      - name: Publish static assets
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::notice::Deployment skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to publish.'
            exit 0
          fi
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Commit after a successful publish, an unconfigured deployment, or no content change.
      # A failed deployment leaves the previous snapshot so the next scheduled run retries.
      # checkedAt records automated repository activity even while the author is inactive.
      - name: Persist last-known-good content and collection health
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/data/generated.json src/data/tracks.json src/data/series.json src/data/previews.json src/data/image-cache.json public/media
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public content snapshot [skip ci]'
            git push
          fi
