# Tests database.rules.json against the Realtime Database emulator, and deploys it to the
# dedicated stamps database when it (or the page list it is generated from) changes on main.
# The rules are generated by `npm run rules` (scripts/database-rules.mjs) and committed; a
# pull request whose committed rules do not match its works.json / manual.json fails here.
# The site itself is still published by Cloudflare Workers Builds; this workflow only touches
# the rules of cp20-platform-portfolio-stamps (see .firebaserc).
name: Firebase rules
on:
  push:
    branches: [main]
    paths:
      - database.rules.json
      - firebase.json
      - .firebaserc
      - scripts/stamps-rules.mjs
      - scripts/rules.mjs
      - scripts/database-rules.mjs
      - src/data/stamp-write.mjs
      - src/data/stamp-limits.mjs
      - src/data/site-pages.mjs
      - src/data/works.json
      - src/data/manual.json
      - .github/workflows/firebase-rules.yml
  pull_request:
    paths:
      - database.rules.json
      - firebase.json
      - .firebaserc
      - scripts/stamps-rules.mjs
      - scripts/rules.mjs
      - scripts/database-rules.mjs
      - src/data/stamp-write.mjs
      - src/data/stamp-limits.mjs
      - src/data/site-pages.mjs
      - src/data/works.json
      - src/data/manual.json
      - .github/workflows/firebase-rules.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-rules-${{ github.ref }}
  cancel-in-progress: false
env:
  FIREBASE_TOOLS: firebase-tools@15.34.2
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # These scripts only import node built-ins and dependency-free modules in src/data,
      # so no npm ci is needed. The emulator runs locally and needs no credentials.
      - name: Rules match the page list
        run: node scripts/rules.mjs --check
      - name: Rules integration test (emulator)
        run: >-
          npx --yes "$FIREBASE_TOOLS" emulators:exec --project cp20-platform --only database
          "STAMPS_RULES_EMULATOR=127.0.0.1:9000 node scripts/stamps-rules.mjs"
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Optional: add required reviewers to this environment in the repository settings.
    environment: firebase-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Rules match the page list
        run: node scripts/rules.mjs --check
      # Service account with "Firebase Realtime Database Admin" on cp20-platform.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy rules to the stamps database only
        run: npx --yes "$FIREBASE_TOOLS" deploy --only database:portfolio-stamps --project cp20-platform --non-interactive
